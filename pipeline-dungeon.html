<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline Dungeon — Dave's Handover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #121212;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Press Start 2P", monospace;
    }
    #wrap {
      position: relative;
      line-height: 0;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      border: 4px solid #5a5a5a;
      box-shadow: 0 0 0 2px #1a1a1a, 0 0 24px rgba(0,0,0,0.55);
    }
    #finale {
      display: none;
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      font-size: 11px;
      line-height: 1.6;
    }
    #finale a {
      color: #d8d8d8;
    }
    #finale.visible { display: block; }
    #hint {
      position: fixed;
      bottom: 8px;
      left: 0; right: 0;
      text-align: center;
      font-size: 8px;
      color: #6a6a6a;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="480" height="456" aria-label="Pipeline Dungeon game"></canvas>
    <div id="finale">
      <a href="https://codemagic.io" target="_blank" rel="noopener noreferrer">codemagic.io</a>
    </div>
  </div>
  <p id="hint">Arrows move · Space/Enter interact · ?debug=1 then R = skip room</p>

  <script>
(function () {
  'use strict';

  /** Tunables */
  const TILE = 48;
  const GW = 10;
  const GH = 8;
  const HUD_H = Math.round(TILE * 1.5);
  const CANVAS_W = GW * TILE;
  const CANVAS_H = GH * TILE + HUD_H;
  const KEY_REPEAT_MS = 140;
  const DEBUG = /[?&]debug=1(?:&|$)/.test(location.search);

  /** DMG-style greyscale: 0 darkest … 3 lightest */
  const P = ['#1a1a1a', '#4a4a4a', '#9a9a9a', '#d8d8d8'];
  const OVERLAY_BG = 'rgba(26,26,26,0.94)';
  const FINALE_DIM = 'rgba(26,26,26,0.88)';

  /** Press Start 2P scales with tile (readable on larger canvas) */
  const FONT = {
    xs: Math.max(6, Math.floor(TILE * 0.167)) + 'px',
    sm: Math.max(7, Math.floor(TILE * 0.187)) + 'px',
    md: Math.max(8, Math.floor(TILE * 0.208)) + 'px',
    lg: Math.max(10, Math.floor(TILE * 0.25)) + 'px',
  };

  const FACINGS = { up: 0, right: 1, down: 2, left: 3 };
  const DX = [0, 1, 0, -1];
  const DY = [-1, 0, 1, 0];

  /** Canonical puzzle answers — edit freely */
  const PUZZLE_CONFIG = {
    gemfile: {
      /** Correct order of three gem versions at the Bundler shrine */
      correctOrder: ['2.7.8', '3.1.0', '1.5.4'],
      bundleError: 'Could not find gem \'ci-mystery-0.0.1\' in any of the gem sources listed in your Gemfile.',
    },
    certificates: {
      correctCertId: 'c_dist',
      emailBody: '…Fwd: RE: iOS certs — DELETE OLD — use the one marked **Distribution** for store uploads. Not the dev profile. …(rest corrupted)',
    },
    passphrase: {
      /** Fragments from voicemail; player orders these two + fixed tail */
      fragments: ['NIGHTLY', 'SHIP'],
      tail: 'IT',
      correctOrder: ['NIGHTLY', 'SHIP', 'IT'], // NIGHTLY SHIP IT
    },
    vault: {
      correctId: 'v_1password',
      githubId: 'v_github',
    },
    yaml: {
      workaroundId: 'y_w3',
    },
  };

  const COPY = {
    dave: {
      gemfile: 'Dave: "Just run bundle install, it\'s all in there."',
      certificates: 'Dave: "Use the renewed cert, not the old one. You\'ll know."',
      passphrase: 'Dave: "Passphrase is somewhere safe. Steve knows."',
      vault: 'Dave: "The p8 is in the safe place, not the other place."',
      yaml: 'Dave: "Don\'t touch the workaround. You\'ll know which part."',
    },
    winDoor: 'Something clicks. The door is loose now.',
    pipelineRuns: '>>> PIPELINE SUCCEEDED\nBuild 2048 · signed · uploaded\n(You fixed Dave\'s maze.)',
    betterWay: 'There is a better way than inheriting this dungeon.',
    codemagicPitch: 'Codemagic: iOS/Android CI that doesn\'t need Dave\'s YAML yoga.',
  };

  /** Room tile rows: # wall, . floor, = door (logic overlays locked/open) */
  const BASE_FLOOR = [
    '##########',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '##..===..#',
  ];

  function cloneTiles() {
    return BASE_FLOOR.map(function (r) { return r.split('').join(''); });
  }

  /**
   * entities: static fields use x,y in tile coords.
   * kind: dave | pickup | interact
   * subtype: scrap | email | vm_a | vm_b | bundler | cert | lock | vault | yaml_read | yaml_judge
   */
  const ROOMS = [
    {
      id: 'gemfile',
      title: 'The Gemfile',
      puzzle: 'gemCombo',
      tiles: cloneTiles(),
      spawn: { x: 5, y: 4, f: FACINGS.down },
      entities: [
        { kind: 'dave', x: 5, y: 1, noteKey: 'gemfile' },
        { kind: 'pickup', subtype: 'scrap', scrapId: 'a', version: '2.7.8', x: 2, y: 3 },
        { kind: 'pickup', subtype: 'scrap', scrapId: 'b', version: '3.1.0', x: 7, y: 3 },
        { kind: 'pickup', subtype: 'scrap', scrapId: 'c', version: '1.5.4', x: 5, y: 2 },
        { kind: 'interact', subtype: 'bundler', x: 8, y: 5 },
      ],
    },
    {
      id: 'certificates',
      title: 'The Certificates',
      puzzle: 'certPick',
      tiles: cloneTiles(),
      spawn: { x: 5, y: 5, f: FACINGS.up },
      entities: [
        { kind: 'dave', x: 5, y: 6, noteKey: 'certificates' },
        { kind: 'pickup', subtype: 'email', x: 5, y: 3 },
        { kind: 'interact', subtype: 'cert', certId: 'c_dev', label: 'Profile: "Dave iPhone"', x: 2, y: 1 },
        { kind: 'interact', subtype: 'cert', certId: 'c_push', label: 'Apple Push: ???', x: 4, y: 1 },
        { kind: 'interact', subtype: 'cert', certId: 'c_adhoc', label: 'Ad Hoc: "Friday build"', x: 6, y: 1 },
        { kind: 'interact', subtype: 'cert', certId: 'c_dist', label: 'iPhone Distribution: (renewed)', x: 8, y: 1 },
      ],
    },
    {
      id: 'passphrase',
      title: 'The Match Passphrase',
      puzzle: 'passphrase',
      tiles: cloneTiles(),
      spawn: { x: 5, y: 5, f: FACINGS.up },
      entities: [
        { kind: 'dave', x: 5, y: 6, noteKey: 'passphrase' },
        { kind: 'pickup', subtype: 'vm_a', x: 2, y: 3 },
        { kind: 'pickup', subtype: 'vm_b', x: 8, y: 3 },
        { kind: 'interact', subtype: 'lock', x: 5, y: 2 },
      ],
    },
    {
      id: 'vault',
      title: 'The Secrets Vault',
      puzzle: 'vaultPick',
      tiles: cloneTiles(),
      spawn: { x: 5, y: 5, f: FACINGS.up },
      entities: [
        { kind: 'dave', x: 5, y: 6, noteKey: 'vault' },
        { kind: 'interact', subtype: 'vault', vaultId: 'v_slack', label: '#incident-link channel pin', x: 2, y: 2 },
        { kind: 'interact', subtype: 'vault', vaultId: 'v_github', label: 'Public repo: ios-secrets (README)', x: 8, y: 2 },
        { kind: 'interact', subtype: 'vault', vaultId: 'v_notes', label: 'Dave\'s Notes.app folder', x: 5, y: 2 },
        { kind: 'interact', subtype: 'vault', vaultId: 'v_1password', label: '1Password vault "Mobile"', x: 3, y: 4 },
        { kind: 'interact', subtype: 'vault', vaultId: 'v_disk', label: 'USB stick labeled "NEW"', x: 7, y: 4 },
      ],
    },
    {
      id: 'yaml',
      title: 'The YAML Room',
      puzzle: 'yamlLeaveAlone',
      tiles: cloneTiles(),
      spawn: { x: 5, y: 5, f: FACINGS.up },
      entities: [
        { kind: 'dave', x: 5, y: 6, noteKey: 'yaml' },
        { kind: 'interact', subtype: 'yaml_read', yid: 'y1', text: '# TODO: remove after WWDC', x: 1, y: 1 },
        { kind: 'interact', subtype: 'yaml_read', yid: 'y2', text: '# workaround: disable flaky test', x: 3, y: 1 },
        { kind: 'interact', subtype: 'yaml_read', yid: 'y_w3', text: '# DO NOT REMOVE — Dave: pipeline dies without this', x: 5, y: 1 },
        { kind: 'interact', subtype: 'yaml_read', yid: 'y4', text: '# legacy Fastlane path', x: 7, y: 1 },
        { kind: 'interact', subtype: 'yaml_read', yid: 'y5', text: '# Steve said this was fine', x: 8, y: 1 },
        { kind: 'interact', subtype: 'yaml_read', yid: 'y6', text: '# bump when Xcode cries', x: 2, y: 2 },
        { kind: 'interact', subtype: 'yaml_judge', x: 8, y: 5 },
      ],
    },
  ];

  const DOOR_TILES = [{ x: 4, y: 7 }, { x: 5, y: 7 }, { x: 6, y: 7 }];

  function isDoorTile(tx, ty) {
    return DOOR_TILES.some(function (d) { return d.x === tx && d.y === ty; });
  }

  function freshProgress() {
    return {
      gemfile: { solved: false, gems: [] },
      certificates: { solved: false, hasEmail: false },
      passphrase: { solved: false, hasA: false, hasB: false },
      vault: { solved: false },
      yaml: { solved: false, readIds: {} },
    };
  }

  let state = {
    roomIndex: 0,
    px: 5,
    py: 4,
    facing: FACINGS.down,
    inv: {
      scraps: [],
      email: false,
      vm_a: false,
      vm_b: false,
    },
    progress: freshProgress(),
    mode: 'play',
    dialog: [],
    gemUI: null,
    passUI: null,
    yamlPickIndex: 0,
    finale: false,
    endingOnce: false,
    keys: Object.create(null),
    lastMove: 0,
  };

  function room() {
    return ROOMS[state.roomIndex];
  }

  function doorOpen() {
    var rid = room().id;
    if (rid === 'yaml' && state.progress.yaml.solved) return true;
    return state.progress[rid] && state.progress[rid].solved;
  }

  function tileBlocks(tx, ty) {
    var row = room().tiles[ty];
    if (!row) return true;
    var c = row[tx];
    if (c === '#') return true;
    if (c === '=' || isDoorTile(tx, ty)) {
      if (!doorOpen()) return true;
      return false;
    }
    return false;
  }

  function resetGame() {
    state.roomIndex = 0;
    state.px = ROOMS[0].spawn.x;
    state.py = ROOMS[0].spawn.y;
    state.facing = ROOMS[0].spawn.f;
    state.inv = { scraps: [], email: false, vm_a: false, vm_b: false };
    state.progress = freshProgress();
    state.mode = 'play';
    state.dialog = [];
    state.gemUI = null;
    state.passUI = null;
    state.yamlPickIndex = 0;
    state.finale = false;
    state.endingOnce = false;
    ROOMS.forEach(function (r) {
      r.entities.forEach(function (e) {
        delete e._removed;
      });
    });
    document.getElementById('finale').classList.remove('visible');
  }

  function entityAt(tx, ty) {
    var list = room().entities;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e._removed) continue;
      if (e.x === tx && e.y === ty) return e;
    }
    return null;
  }

  function pushDialog(lines) {
    state.mode = 'dialog';
    state.dialog = state.dialog.concat(lines);
  }

  function advanceDialog() {
    state.dialog.shift();
    if (state.dialog.length === 0) state.mode = 'play';
  }

  function tryMove(dir) {
    if (state.mode !== 'play') return;
    var now = performance.now();
    if (now - state.lastMove < KEY_REPEAT_MS) return;
    state.facing = dir;
    var nx = state.px + DX[dir];
    var ny = state.py + DY[dir];
    if (tileBlocks(nx, ny)) {
      state.lastMove = now;
      return;
    }
    state.px = nx;
    state.py = ny;
    state.lastMove = now;

    if (doorOpen() && isDoorTile(state.px, state.py)) {
      if (state.roomIndex < ROOMS.length - 1) {
        state.roomIndex++;
        var sp = room().spawn;
        state.px = sp.x;
        state.py = sp.y;
        state.facing = sp.f;
        pushDialog(['You squeeze through to ' + room().title + '…']);
      } else if (
        !state.endingOnce &&
        state.roomIndex === ROOMS.length - 1 &&
        room().id === 'yaml' &&
        state.progress.yaml.solved
      ) {
        startEnding();
      }
    }

    var ent = entityAt(state.px, state.py);
    if (ent && ent.kind === 'pickup') {
      pickupEntity(ent);
    }
  }

  function pickupEntity(ent) {
    if (ent.subtype === 'scrap') {
      state.inv.scraps.push({ id: ent.scrapId, v: ent.version });
      ent._removed = true;
      pushDialog(['Picked up a Gemfile scrap: ' + ent.version]);
    } else if (ent.subtype === 'email') {
      state.progress.certificates.hasEmail = true;
      ent._removed = true;
      pushDialog(['Half-deleted email recovered.', PUZZLE_CONFIG.certificates.emailBody]);
    } else if (ent.subtype === 'vm_a') {
      state.inv.vm_a = true;
      ent._removed = true;
      pushDialog(['Voicemail transcript (part 1): "' + PUZZLE_CONFIG.passphrase.fragments[0] + '…"']);
    } else if (ent.subtype === 'vm_b') {
      state.inv.vm_b = true;
      ent._removed = true;
      pushDialog(['Voicemail transcript (part 2): "…' + PUZZLE_CONFIG.passphrase.fragments[1] + '…"']);
    }
  }

  function facingCell() {
    return {
      x: state.px + DX[state.facing],
      y: state.py + DY[state.facing],
    };
  }

  function tryInteract() {
    if (state.mode === 'dialog') {
      advanceDialog();
      return;
    }
    if (state.mode === 'puzzleGem') return gemUIKey('action');
    if (state.mode === 'puzzlePass') return passUIKey('action');
    if (state.mode === 'puzzleYaml') return yamlUIKey('action');
    if (state.mode !== 'play') return;

    var fc = facingCell();
    var ent = entityAt(fc.x, fc.y);
    if (!ent) return;

    if (ent.kind === 'dave') {
      pushDialog([COPY.dave[ent.noteKey]]);
      return;
    }
    if (ent.kind === 'interact') {
      if (ent.subtype === 'bundler') {
        if (state.progress.gemfile.solved) {
          pushDialog(['Bundler shrine hums quietly. Already satisfied.']);
          return;
        }
        if (state.inv.scraps.length < 3) {
          pushDialog(['Three version scraps shimmer on the floor first…']);
          return;
        }
        openGemUI();
        return;
      }
      if (ent.subtype === 'cert') {
        if (!state.progress.certificates.hasEmail) {
          pushDialog(['You squint at the wall. Without context this is hieroglyphics.']);
          return;
        }
        if (state.progress.certificates.solved) {
          pushDialog(['You already picked the right cert.']);
          return;
        }
        if (ent.certId === PUZZLE_CONFIG.certificates.correctCertId) {
          state.progress.certificates.solved = true;
          pushDialog(['This one matches the email. Keys jingle approvingly.', COPY.winDoor]);
        } else {
          pushDialog(['Wrong profile. Xcode would laugh at you. Try another plaque.']);
        }
        return;
      }
      if (ent.subtype === 'lock') {
        if (state.progress.passphrase.solved) {
          pushDialog(['Lock already open.']);
          return;
        }
        if (!state.inv.vm_a || !state.inv.vm_b) {
          pushDialog(['The lock display blinks: need both voicemail scraps.']);
          return;
        }
        openPassUI();
        return;
      }
      if (ent.subtype === 'vault') {
        if (state.progress.vault.solved) {
          pushDialog(['You already chose where the p8 lives.']);
          return;
        }
        if (ent.vaultId === PUZZLE_CONFIG.vault.githubId) {
          pushDialog([
            'You peek at the public GitHub repo.',
            'A thousand bots stare back. Secrets diff in real time. You close the tab.',
            '(That was not the safe place.)',
          ]);
          return;
        }
        if (ent.vaultId === PUZZLE_CONFIG.vault.correctId) {
          state.progress.vault.solved = true;
          pushDialog(['1Password it is. The p8 breathes easy.', COPY.winDoor]);
        } else {
          pushDialog(['Plausible, but Dave\'s voice echoes: "not the other place." Keep looking.']);
        }
        return;
      }
      if (ent.subtype === 'yaml_read') {
        pushDialog([ent.text]);
        state.progress.yaml.readIds[ent.yid] = true;
        return;
      }
      if (ent.subtype === 'yaml_judge') {
        if (state.progress.yaml.solved) {
          pushDialog(['Workaround already respected.']);
          return;
        }
        state.mode = 'puzzleYaml';
        state.yamlPickIndex = 0;
        return;
      }
    }
  }

  function openGemUI() {
    var versions = state.inv.scraps.map(function (s) { return s.v; });
    var idx0 = versions.indexOf(PUZZLE_CONFIG.gemfile.correctOrder[0]);
    var idx1 = versions.indexOf(PUZZLE_CONFIG.gemfile.correctOrder[1]);
    var idx2 = versions.indexOf(PUZZLE_CONFIG.gemfile.correctOrder[2]);
    if (idx0 < 0 || idx1 < 0 || idx2 < 0) {
      pushDialog(['Scraps are corrupted. Collect all three first.']);
      return;
    }
    /** Start one rotation off correct so bundle is not already satisfied */
    var choices = [idx0, idx1, idx2];
    choices = [(choices[0] + 1) % 3, (choices[1] + 1) % 3, (choices[2] + 1) % 3];
    state.gemUI = { slot: 0, choices: choices };
    state.mode = 'puzzleGem';
  }

  function gemUIKey(action, dir) {
    var g = state.gemUI;
    if (!g) return;
    var vers = state.inv.scraps.map(function (s) { return s.v; });
    if (action === 'left') {
      g.slot = (g.slot + 2) % 3;
    } else if (action === 'right') {
      g.slot = (g.slot + 1) % 3;
    } else if (action === 'up' || action === 'down') {
      var delta = action === 'up' ? 1 : -1;
      g.choices[g.slot] = (g.choices[g.slot] + delta + vers.length) % vers.length;
    } else if (action === 'action') {
      var pick = g.choices.map(function (ci) { return vers[ci]; });
      var ok = pick.every(function (v, i) { return v === PUZZLE_CONFIG.gemfile.correctOrder[i]; });
      state.gemUI = null;
      state.mode = 'play';
      if (ok) {
        state.progress.gemfile.solved = true;
        pushDialog(['bundle install completes. The shrine weeps ruby tears.', COPY.winDoor]);
      } else {
        pushDialog([PUZZLE_CONFIG.gemfile.bundleError, 'The combination was wrong.']);
      }
    }
  }

  function openPassUI() {
    state.passUI = {
      /** Wrong initial fragment order (swap to NIGHTLY then SHIP) */
      order: [1, 0],
      slot: 0,
    };
    state.mode = 'puzzlePass';
  }

  function passUIKey(action) {
    var p = state.passUI;
    if (!p) return;
    if (action === 'left' || action === 'right') {
      p.slot = 1 - p.slot;
    } else if (action === 'up' || action === 'down') {
      var o = p.order.slice();
      if (p.slot === 0) {
        o[0] = (o[0] + (action === 'up' ? 1 : -1) + 2) % 2;
      } else {
        o[1] = (o[1] + (action === 'up' ? 1 : -1) + 2) % 2;
      }
      p.order = o;
    } else if (action === 'action') {
      var fr = PUZZLE_CONFIG.passphrase.fragments;
      var a = fr[p.order[0]];
      var b = fr[p.order[1]];
      var tail = PUZZLE_CONFIG.passphrase.tail;
      var guess = [a, b, tail];
      var ok = guess.join('|') === PUZZLE_CONFIG.passphrase.correctOrder.join('|');
      state.passUI = null;
      state.mode = 'play';
      if (ok) {
        state.progress.passphrase.solved = true;
        pushDialog(['MATCH accepts: ' + a + b + tail, COPY.winDoor]);
      } else {
        pushDialog(['MATCH scowls. Order matters. Try again.']);
      }
    }
  }

  var YAML_ORDER = ['y1', 'y2', 'y_w3', 'y4', 'y5', 'y6'];

  function yamlUIKey(action) {
    if (state.mode !== 'puzzleYaml') return;
    if (action === 'left') {
      state.yamlPickIndex = (state.yamlPickIndex + YAML_ORDER.length - 1) % YAML_ORDER.length;
    } else if (action === 'right') {
      state.yamlPickIndex = (state.yamlPickIndex + 1) % YAML_ORDER.length;
    } else if (action === 'action') {
      var pick = YAML_ORDER[state.yamlPickIndex];
      state.mode = 'play';
      if (pick === PUZZLE_CONFIG.yaml.workaroundId) {
        state.progress.yaml.solved = true;
        pushDialog(['You vow to never delete that line.', COPY.winDoor]);
      } else {
        pushDialog(['You "clean up" the wrong comment.', '>>> PIPELINE FAILED', 'Dave was right. Undo undo undo.']);
      }
    }
  }

  function startEnding() {
    if (state.endingOnce) return;
    state.endingOnce = true;
    state.finale = true;
    state.mode = 'dialog';
    state.dialog = [
      COPY.pipelineRuns,
      COPY.betterWay,
      COPY.codemagicPitch,
    ];
  }

  function onKeyDown(e) {
    var k = e.code;
    state.keys[k] = true;
    if (DEBUG && k === 'KeyR') {
      state.roomIndex = Math.min(ROOMS.length - 1, state.roomIndex + 1);
      var sp = room().spawn;
      state.px = sp.x; state.py = sp.y; state.facing = sp.f;
      state.mode = 'play';
      state.dialog = [];
    }
    if (state.mode === 'dialog' && (k === 'Space' || k === 'Enter')) {
      e.preventDefault();
      advanceDialog();
      if (state.finale && state.dialog.length === 0) {
        document.getElementById('finale').classList.add('visible');
      }
      return;
    }
    if (k === 'Space' || k === 'Enter') {
      e.preventDefault();
      tryInteract();
      return;
    }
    if (state.mode === 'puzzleGem') {
      if (k === 'ArrowLeft') { e.preventDefault(); gemUIKey('left'); }
      else if (k === 'ArrowRight') { e.preventDefault(); gemUIKey('right'); }
      else if (k === 'ArrowUp') { e.preventDefault(); gemUIKey('up'); }
      else if (k === 'ArrowDown') { e.preventDefault(); gemUIKey('down'); }
      return;
    }
    if (state.mode === 'puzzlePass') {
      if (k === 'ArrowLeft') { e.preventDefault(); passUIKey('left'); }
      else if (k === 'ArrowRight') { e.preventDefault(); passUIKey('right'); }
      else if (k === 'ArrowUp') { e.preventDefault(); passUIKey('up'); }
      else if (k === 'ArrowDown') { e.preventDefault(); passUIKey('down'); }
      return;
    }
    if (state.mode === 'puzzleYaml') {
      if (k === 'ArrowLeft') { e.preventDefault(); yamlUIKey('left'); }
      else if (k === 'ArrowRight') { e.preventDefault(); yamlUIKey('right'); }
      return;
    }
    if (state.mode === 'play') {
      if (k === 'ArrowUp') { e.preventDefault(); tryMove(FACINGS.up); }
      else if (k === 'ArrowDown') { e.preventDefault(); tryMove(FACINGS.down); }
      else if (k === 'ArrowLeft') { e.preventDefault(); tryMove(FACINGS.left); }
      else if (k === 'ArrowRight') { e.preventDefault(); tryMove(FACINGS.right); }
    }
  }

  function onKeyUp(e) {
    state.keys[e.code] = false;
  }

  /** --- Draw --- */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  if (canvas.width !== CANVAS_W || canvas.height !== CANVAS_H) {
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
  }
  ctx.imageSmoothingEnabled = false;

  function drawFloorTile(tx, ty) {
    var x = tx * TILE;
    var y = ty * TILE;
    var inset = Math.max(2, Math.floor(TILE * 0.125));
    var alt = (tx + ty) % 2;
    ctx.fillStyle = alt ? P[3] : P[2];
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = P[1];
    ctx.lineWidth = Math.max(1, Math.floor(TILE / 32));
    ctx.strokeRect(x + inset, y + inset, TILE - inset * 2, TILE - inset * 2);
  }

  function drawWallTile(tx, ty) {
    var x = tx * TILE;
    var y = ty * TILE;
    var b = Math.max(2, Math.floor(TILE / 16));
    ctx.fillStyle = P[1];
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = P[2];
    ctx.fillRect(x + b, y + b, TILE - b * 2, TILE - b * 2);
    ctx.fillStyle = P[0];
    ctx.fillRect(x + b * 2, y + b * 2, TILE - b * 4, TILE - b * 4);
    ctx.fillStyle = P[3];
    if ((tx + ty) % 3 === 0) {
      var riv = Math.max(3, Math.floor(TILE / 10));
      ctx.fillRect(x + TILE * 0.3, y + TILE * 0.22, riv, riv);
      ctx.fillRect(x + TILE * 0.55, y + TILE * 0.62, riv, riv);
    }
  }

  function drawDoorTile(tx, ty, open) {
    var x = tx * TILE;
    var y = ty * TILE;
    if (!open) {
      drawWallTile(tx, ty);
      return;
    }
    drawFloorTile(tx, ty);
    var mx = Math.floor(TILE * 0.25);
    var my = Math.floor(TILE * 0.125);
    ctx.fillStyle = P[0];
    ctx.fillRect(x + mx, y + my, TILE - mx * 2, TILE - my * 2);
    ctx.fillStyle = P[2];
    ctx.fillRect(x + mx + 2, y + my + 4, TILE - mx * 2 - 4, TILE - my * 2 - 8);
  }

  function drawWorld() {
    var r = room();
    for (var ty = 0; ty < GH; ty++) {
      for (var tx = 0; tx < GW; tx++) {
        var row = r.tiles[ty];
        var c = row[tx];
        if (isDoorTile(tx, ty)) {
          drawDoorTile(tx, ty, doorOpen());
        } else if (c === '#') {
          drawWallTile(tx, ty);
        } else {
          drawFloorTile(tx, ty);
        }
      }
    }

    r.entities.forEach(function (e) {
      if (e._removed) return;
      drawEntity(e);
    });

    drawPlayer(state.px * TILE, state.py * TILE, state.facing);
  }

  /** Folded paper + gem dot */
  function drawScrapPickup(ex, ey) {
    var m = TILE * 0.18;
    ctx.fillStyle = P[3];
    ctx.beginPath();
    ctx.moveTo(ex + m, ey + TILE * 0.35);
    ctx.lineTo(ex + TILE - m, ey + TILE * 0.28);
    ctx.lineTo(ex + TILE - m * 0.7, ey + TILE * 0.72);
    ctx.lineTo(ex + m * 1.2, ey + TILE * 0.78);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = P[0];
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = P[0];
    ctx.fillRect(ex + TILE * 0.55, ey + TILE * 0.32, TILE * 0.22, TILE * 0.12);
    ctx.fillStyle = P[1];
    ctx.beginPath();
    ctx.arc(ex + TILE * 0.35, ey + TILE * 0.55, TILE * 0.08, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawEnvelopePickup(ex, ey) {
    var cx = ex + TILE / 2;
    var top = ey + TILE * 0.28;
    var bot = ey + TILE * 0.72;
    ctx.fillStyle = P[2];
    ctx.beginPath();
    ctx.moveTo(ex + TILE * 0.2, top);
    ctx.lineTo(ex + TILE * 0.8, top);
    ctx.lineTo(ex + TILE * 0.8, bot);
    ctx.lineTo(ex + TILE * 0.2, bot);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = P[0];
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ex + TILE * 0.2, top);
    ctx.lineTo(cx, ey + TILE * 0.48);
    ctx.lineTo(ex + TILE * 0.8, top);
    ctx.stroke();
  }

  function drawTapePickup(ex, ey) {
    var w = TILE * 0.5;
    var h = TILE * 0.35;
    var x = ex + (TILE - w) / 2;
    var y = ey + TILE * 0.32;
    ctx.fillStyle = P[0];
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = P[2];
    ctx.fillRect(x + w * 0.08, y + h * 0.2, w * 0.84, h * 0.55);
    ctx.fillStyle = P[3];
    ctx.fillRect(x + w * 0.35, y + h * 0.08, w * 0.3, h * 0.84);
  }

  function drawDavePlaque(ex, ey) {
    var pad = TILE * 0.12;
    ctx.fillStyle = P[1];
    ctx.fillRect(ex + pad, ey + pad * 1.5, TILE - pad * 2, TILE - pad * 2.5);
    ctx.strokeStyle = P[0];
    ctx.lineWidth = 2;
    ctx.strokeRect(ex + pad, ey + pad * 1.5, TILE - pad * 2, TILE - pad * 2.5);
    ctx.fillStyle = P[3];
    ctx.beginPath();
    ctx.arc(ex + TILE * 0.35, ey + TILE * 0.42, TILE * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = P[0];
    ctx.fillRect(ex + TILE * 0.52, ey + TILE * 0.38, TILE * 0.22, TILE * 0.06);
    ctx.font = FONT.sm + ' "Press Start 2P", monospace';
    ctx.fillText('?', ex + TILE * 0.52, ey + TILE * 0.72);
  }

  function drawBundler(ex, ey) {
    var p = TILE * 0.14;
    ctx.fillStyle = P[0];
    ctx.fillRect(ex + p, ey + p * 1.2, TILE - p * 2, TILE - p * 2.2);
    ctx.fillStyle = P[2];
    ctx.fillRect(ex + p * 1.5, ey + p * 1.8, TILE - p * 3, TILE * 0.38);
    ctx.fillStyle = P[3];
    ctx.fillRect(ex + p * 2, ey + p * 2.6, TILE - p * 4, TILE * 0.22);
    ctx.fillStyle = P[1];
    ctx.fillRect(ex + TILE * 0.42, ey + TILE * 0.62, TILE * 0.16, TILE * 0.08);
  }

  function drawCertPlaque(ex, ey) {
    ctx.fillStyle = P[1];
    ctx.fillRect(ex + TILE * 0.1, ey + TILE * 0.12, TILE * 0.8, TILE * 0.55);
    ctx.strokeStyle = P[0];
    ctx.lineWidth = 2;
    ctx.strokeRect(ex + TILE * 0.1, ey + TILE * 0.12, TILE * 0.8, TILE * 0.55);
    ctx.fillStyle = P[3];
    ctx.fillRect(ex + TILE * 0.18, ey + TILE * 0.22, TILE * 0.64, TILE * 0.08);
    ctx.fillRect(ex + TILE * 0.18, ey + TILE * 0.36, TILE * 0.45, TILE * 0.06);
    ctx.fillRect(ex + TILE * 0.18, ey + TILE * 0.46, TILE * 0.55, TILE * 0.06);
  }

  function drawPadlock(ex, ey) {
    var cx = ex + TILE / 2;
    var cy = ey + TILE * 0.48;
    var r = TILE * 0.22;
    ctx.lineWidth = Math.max(3, TILE / 12);
    ctx.strokeStyle = P[0];
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI, 0);
    ctx.stroke();
    ctx.fillStyle = P[0];
    ctx.beginPath();
    ctx.arc(cx, cy + r * 0.2, r * 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = P[2];
    ctx.fillRect(cx - r * 0.35, cy + r * 0.15, r * 0.7, r * 0.55);
  }

  function drawVaultProp(ex, ey) {
    ctx.fillStyle = P[1];
    ctx.fillRect(ex + TILE * 0.22, ey + TILE * 0.38, TILE * 0.56, TILE * 0.38);
    ctx.fillStyle = P[0];
    ctx.fillRect(ex + TILE * 0.38, ey + TILE * 0.3, TILE * 0.24, TILE * 0.12);
    ctx.strokeStyle = P[0];
    ctx.lineWidth = 2;
    ctx.strokeRect(ex + TILE * 0.22, ey + TILE * 0.38, TILE * 0.56, TILE * 0.38);
    ctx.fillStyle = P[3];
    ctx.fillRect(ex + TILE * 0.42, ey + TILE * 0.5, TILE * 0.16, TILE * 0.14);
  }

  function drawYamlTablet(ex, ey) {
    ctx.fillStyle = P[0];
    ctx.fillRect(ex + TILE * 0.12, ey + TILE * 0.18, TILE * 0.76, TILE * 0.62);
    ctx.fillStyle = P[2];
    for (var i = 0; i < 4; i++) {
      ctx.fillRect(ex + TILE * 0.18, ey + TILE * 0.26 + i * TILE * 0.12, TILE * 0.55, TILE * 0.04);
    }
    ctx.fillStyle = P[3];
    ctx.fillRect(ex + TILE * 0.18, ey + TILE * 0.28, TILE * 0.2, TILE * 0.04);
  }

  function drawYamlJudge(ex, ey) {
    ctx.fillStyle = P[2];
    ctx.fillRect(ex + TILE * 0.15, ey + TILE * 0.28, TILE * 0.7, TILE * 0.5);
    ctx.strokeStyle = P[0];
    ctx.lineWidth = 2;
    ctx.strokeRect(ex + TILE * 0.15, ey + TILE * 0.28, TILE * 0.7, TILE * 0.5);
    ctx.fillStyle = P[0];
    ctx.font = FONT.md + ' "Press Start 2P", monospace';
    ctx.fillText('!', ex + TILE * 0.42, ey + TILE * 0.58);
  }

  function drawEntity(e) {
    var ex = e.x * TILE;
    var ey = e.y * TILE;
    if (e.kind === 'dave') {
      drawDavePlaque(ex, ey);
    } else if (e.kind === 'pickup') {
      if (e.subtype === 'scrap') drawScrapPickup(ex, ey);
      else if (e.subtype === 'email') drawEnvelopePickup(ex, ey);
      else if (e.subtype === 'vm_a' || e.subtype === 'vm_b') drawTapePickup(ex, ey);
    } else if (e.kind === 'interact') {
      if (e.subtype === 'bundler') drawBundler(ex, ey);
      else if (e.subtype === 'cert') drawCertPlaque(ex, ey);
      else if (e.subtype === 'lock') drawPadlock(ex, ey);
      else if (e.subtype === 'vault') drawVaultProp(ex, ey);
      else if (e.subtype === 'yaml_read') drawYamlTablet(ex, ey);
      else if (e.subtype === 'yaml_judge') drawYamlJudge(ex, ey);
    }
  }

  /** Top-down hero: head, tunic, boots, shield, sword by facing */
  function drawPlayer(px, py, facing) {
    var t = TILE;
    var cx = px + t * 0.5;
    var lw = Math.max(2, Math.floor(t / 22));

    ctx.fillStyle = P[0];
    ctx.beginPath();
    ctx.ellipse(cx, py + t * 0.9, t * 0.24, t * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();

    var bw = t * 0.14;
    var bh = t * 0.11;
    ctx.fillStyle = P[0];
    ctx.fillRect(cx - t * 0.2 - bw / 2, py + t * 0.7, bw, bh);
    ctx.fillRect(cx + t * 0.2 - bw / 2, py + t * 0.7, bw, bh);

    ctx.fillStyle = P[1];
    ctx.fillRect(cx - t * 0.18, py + t * 0.52, t * 0.14, t * 0.24);
    ctx.fillRect(cx + t * 0.04, py + t * 0.52, t * 0.14, t * 0.24);

    ctx.fillStyle = P[2];
    ctx.fillRect(cx - t * 0.24, py + t * 0.38, t * 0.48, t * 0.22);
    ctx.fillStyle = P[1];
    ctx.fillRect(cx - t * 0.2, py + t * 0.42, t * 0.4, t * 0.16);

    ctx.fillStyle = P[2];
    ctx.fillRect(cx - t * 0.3, py + t * 0.4, t * 0.6, t * 0.12);

    ctx.fillStyle = P[3];
    ctx.beginPath();
    ctx.arc(cx, py + t * 0.28, t * 0.17, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = P[0];
    ctx.lineWidth = lw;
    ctx.stroke();

    ctx.fillStyle = P[0];
    ctx.beginPath();
    ctx.arc(cx, py + t * 0.22, t * 0.15, Math.PI, 0);
    ctx.fill();

    var sw = t * 0.16;
    var sh = t * 0.24;
    function shield(sx, sy) {
      ctx.fillStyle = P[2];
      ctx.fillRect(sx, sy, sw, sh);
      ctx.strokeStyle = P[0];
      ctx.lineWidth = lw;
      ctx.strokeRect(sx, sy, sw, sh);
      ctx.fillStyle = P[3];
      ctx.fillRect(sx + sw * 0.2, sy + sh * 0.25, sw * 0.55, sh * 0.45);
    }

    if (facing === FACINGS.down) shield(cx - t * 0.42, py + t * 0.42);
    else if (facing === FACINGS.up) shield(cx + t * 0.26, py + t * 0.42);
    else if (facing === FACINGS.right) shield(cx - t * 0.08, py + t * 0.52);
    else shield(cx + t * 0.26, py + t * 0.52);

    ctx.fillStyle = P[3];
    ctx.strokeStyle = P[0];
    ctx.lineWidth = lw;
    var bladeW = Math.max(3, t * 0.08);
    var bladeL = t * 0.32;
    if (facing === FACINGS.down) {
      ctx.fillRect(cx - bladeW / 2, py + t * 0.6, bladeW, bladeL);
      ctx.strokeRect(cx - bladeW / 2, py + t * 0.6, bladeW, bladeL);
    } else if (facing === FACINGS.up) {
      ctx.fillRect(cx - bladeW / 2, py + t * 0.08, bladeW, bladeL);
      ctx.strokeRect(cx - bladeW / 2, py + t * 0.08, bladeW, bladeL);
    } else if (facing === FACINGS.right) {
      ctx.fillRect(cx + t * 0.12, py + t * 0.44 - bladeW / 2, bladeL, bladeW);
      ctx.strokeRect(cx + t * 0.12, py + t * 0.44 - bladeW / 2, bladeL, bladeW);
    } else {
      ctx.fillRect(cx - t * 0.12 - bladeL, py + t * 0.44 - bladeW / 2, bladeL, bladeW);
      ctx.strokeRect(cx - t * 0.12 - bladeL, py + t * 0.44 - bladeW / 2, bladeL, bladeW);
    }
  }

  function drawHudGem(bx, by, s, on) {
    var cx = bx + s / 2;
    var cy = by + s / 2;
    ctx.fillStyle = on ? P[3] : P[1];
    ctx.beginPath();
    ctx.moveTo(cx, by + 2);
    ctx.lineTo(bx + s - 3, cy);
    ctx.lineTo(cx, by + s - 2);
    ctx.lineTo(bx + 3, cy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = P[0];
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawHudMail(bx, by, s, on) {
    ctx.fillStyle = on ? P[2] : P[0];
    ctx.fillRect(bx + 2, by + 4, s - 4, s - 6);
    ctx.strokeStyle = P[3];
    ctx.strokeRect(bx + 2, by + 4, s - 4, s - 6);
    ctx.strokeStyle = on ? P[0] : P[2];
    ctx.beginPath();
    ctx.moveTo(bx + 2, by + 4);
    ctx.lineTo(bx + s / 2, by + s * 0.45);
    ctx.lineTo(bx + s - 2, by + 4);
    ctx.stroke();
  }

  function drawHudTape(bx, by, s, on) {
    ctx.fillStyle = P[0];
    ctx.fillRect(bx + 3, by + s * 0.35, s - 6, s * 0.38);
    ctx.fillStyle = on ? P[2] : P[1];
    ctx.fillRect(bx + 5, by + s * 0.42, s - 10, s * 0.22);
    ctx.fillStyle = P[3];
    ctx.fillRect(bx + s * 0.38, by + s * 0.32, s * 0.24, s * 0.44);
  }

  function drawHudKey(bx, by, s, on) {
    ctx.fillStyle = on ? P[3] : P[1];
    ctx.fillRect(bx + s * 0.42, by + 4, 4, s * 0.55);
    ctx.beginPath();
    ctx.arc(bx + s * 0.35, by + s * 0.35, s * 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = P[0];
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawHudScroll(bx, by, s, on) {
    ctx.fillStyle = on ? P[2] : P[0];
    ctx.fillRect(bx + 4, by + 3, s - 8, s - 6);
    ctx.fillStyle = on ? P[0] : P[2];
    for (var i = 0; i < 3; i++) {
      ctx.fillRect(bx + 7, by + 7 + i * 5, s - 14, 2);
    }
  }

  function drawHUD() {
    var y0 = GH * TILE;
    var pad = Math.max(3, Math.floor(TILE / 14));
    ctx.fillStyle = P[1];
    ctx.fillRect(0, y0, CANVAS_W, HUD_H);
    ctx.strokeStyle = P[0];
    ctx.strokeRect(pad, y0 + pad, CANVAS_W - pad * 2, HUD_H - pad * 2);
    ctx.font = FONT.md + ' "Press Start 2P", monospace';
    ctx.fillStyle = P[3];
    var titleY = y0 + Math.floor(TILE * 0.42);
    ctx.fillText(room().title, pad * 3, titleY);

    var slot = Math.floor(TILE * 0.58);
    var gap = Math.floor(TILE * 0.22);
    var rowY = y0 + Math.floor(TILE * 0.62);
    var startX = pad * 3;

    function slotBox(ix, drawFn, on) {
      var bx = startX + ix * (slot + gap);
      var by = rowY;
      ctx.fillStyle = P[0];
      ctx.fillRect(bx, by, slot, slot);
      ctx.strokeStyle = on ? P[3] : P[2];
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, slot, slot);
      drawFn(bx + 2, by + 2, slot - 4, on);
    }

    slotBox(0, drawHudGem, state.inv.scraps.length > 0);
    slotBox(1, drawHudMail, state.inv.email);
    slotBox(2, drawHudTape, state.inv.vm_a && state.inv.vm_b);
    slotBox(3, drawHudKey, state.progress.vault.solved || state.roomIndex > 2);
    slotBox(4, drawHudScroll, Object.keys(state.progress.yaml.readIds).length > 0);

    ctx.fillStyle = P[2];
    ctx.font = FONT.xs + ' "Press Start 2P", monospace';
    ctx.fillText('INV', startX, y0 + HUD_H - pad * 2);
  }

  function wrapText(text, maxW) {
    var words = text.split(' ');
    var lines = [];
    var cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) {
        lines.push(cur);
        cur = words[i];
      } else {
        cur = test;
      }
    }
    if (cur) lines.push(cur);
    return lines.length ? lines : [text];
  }

  function drawDialog() {
    if (state.dialog.length === 0) return;
    var msg = state.dialog[0];
    var boxH = Math.floor(TILE * 2.65);
    var boxY = GH * TILE - boxH - Math.floor(TILE * 0.12);
    var inset = Math.floor(TILE * 0.12);
    ctx.fillStyle = P[0];
    ctx.fillRect(inset, boxY, CANVAS_W - inset * 2, boxH);
    ctx.strokeStyle = P[2];
    ctx.lineWidth = Math.max(2, Math.floor(TILE / 18));
    ctx.strokeRect(inset, boxY, CANVAS_W - inset * 2, boxH);
    ctx.fillStyle = P[3];
    ctx.font = FONT.sm + ' "Press Start 2P", monospace';
    var lines = [];
    wrapText(msg, CANVAS_W - inset * 4).forEach(function (ln) { lines.push(ln); });
    var lineStep = Math.floor(TILE * 0.34);
    lines = lines.slice(0, 6);
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], inset * 2, boxY + Math.floor(TILE * 0.38) + i * lineStep);
    }
    ctx.fillStyle = P[2];
    ctx.font = FONT.xs + ' "Press Start 2P", monospace';
    ctx.fillText('SPACE', CANVAS_W - Math.floor(TILE * 1.65), boxY + boxH - Math.floor(TILE * 0.2));
  }

  function drawGemOverlay() {
    if (state.mode !== 'puzzleGem' || !state.gemUI) return;
    var g = state.gemUI;
    var vers = state.inv.scraps.map(function (s) { return s.v; });
    var inset = Math.floor(TILE * 0.17);
    var oy = Math.floor(TILE * 0.85);
    var oh = Math.floor(TILE * 2.85);
    ctx.fillStyle = OVERLAY_BG;
    ctx.fillRect(inset, oy, CANVAS_W - inset * 2, oh);
    ctx.strokeStyle = P[2];
    ctx.lineWidth = 2;
    ctx.strokeRect(inset, oy, CANVAS_W - inset * 2, oh);
    ctx.fillStyle = P[3];
    ctx.font = FONT.sm + ' "Press Start 2P", monospace';
    ctx.fillText('Bundler: L/R slot', inset * 2, oy + Math.floor(TILE * 0.55));
    ctx.fillText('U/D version · SPACE ok', inset * 2, oy + Math.floor(TILE * 0.95));
    var slotW = Math.floor((CANVAS_W - inset * 6) / 3);
    var cy = oy + Math.floor(TILE * 1.35);
    for (var s = 0; s < 3; s++) {
      var cx = inset * 2 + s * (slotW + inset);
      if (g.slot === s) {
        ctx.strokeStyle = P[3];
        ctx.lineWidth = 2;
        ctx.strokeRect(cx - 3, cy - 3, slotW + 6, Math.floor(TILE * 0.85));
      }
      ctx.fillStyle = P[2];
      ctx.fillRect(cx, cy, slotW, Math.floor(TILE * 0.75));
      ctx.fillStyle = P[0];
      ctx.font = FONT.xs + ' "Press Start 2P", monospace';
      ctx.fillText(vers[g.choices[s]], cx + 6, cy + Math.floor(TILE * 0.52));
    }
    ctx.fillStyle = P[3];
    ctx.font = FONT.xs + ' "Press Start 2P", monospace';
    ctx.fillText('SPACE submit', inset * 2, oy + oh - Math.floor(TILE * 0.35));
  }

  function drawPassOverlay() {
    if (state.mode !== 'puzzlePass' || !state.passUI) return;
    var p = state.passUI;
    var fr = PUZZLE_CONFIG.passphrase.fragments;
    var inset = Math.floor(TILE * 0.17);
    var oy = Math.floor(TILE * 1.0);
    var oh = Math.floor(TILE * 2.55);
    ctx.fillStyle = OVERLAY_BG;
    ctx.fillRect(inset, oy, CANVAS_W - inset * 2, oh);
    ctx.strokeStyle = P[2];
    ctx.lineWidth = 2;
    ctx.strokeRect(inset, oy, CANVAS_W - inset * 2, oh);
    ctx.fillStyle = P[3];
    ctx.font = FONT.sm + ' "Press Start 2P", monospace';
    ctx.fillText('L/R pick slot · U/D swap', inset * 2, oy + Math.floor(TILE * 0.55));
    var parts = [fr[p.order[0]], fr[p.order[1]], PUZZLE_CONFIG.passphrase.tail];
    var slotW = Math.floor((CANVAS_W - inset * 5) / 2);
    var cy = oy + Math.floor(TILE * 1.15);
    for (var i = 0; i < 2; i++) {
      var cx = inset * 2 + i * (slotW + inset);
      if (p.slot === i) {
        ctx.strokeStyle = P[3];
        ctx.strokeRect(cx - 3, cy - 3, slotW + 6, Math.floor(TILE * 0.62));
      }
      ctx.fillStyle = P[2];
      ctx.fillRect(cx, cy, slotW, Math.floor(TILE * 0.52));
      ctx.fillStyle = P[0];
      ctx.font = FONT.xs + ' "Press Start 2P", monospace';
      ctx.fillText(parts[i], cx + 6, cy + Math.floor(TILE * 0.38));
    }
    ctx.fillStyle = P[3];
    ctx.font = FONT.sm + ' "Press Start 2P", monospace';
    ctx.fillText('+' + parts[2] + '  SPACE lock', inset * 2, oy + oh - Math.floor(TILE * 0.35));
  }

  function drawYamlOverlay() {
    if (state.mode !== 'puzzleYaml') return;
    var id = YAML_ORDER[state.yamlPickIndex];
    var label = id === 'y_w3' ? 'Dave workaround?' : 'Comment ' + (state.yamlPickIndex + 1);
    var inset = Math.floor(TILE * 0.33);
    var oy = Math.floor(TILE * 1.08);
    var oh = Math.floor(TILE * 1.85);
    ctx.fillStyle = OVERLAY_BG;
    ctx.fillRect(inset, oy, CANVAS_W - inset * 2, oh);
    ctx.strokeStyle = P[2];
    ctx.lineWidth = 2;
    ctx.strokeRect(inset, oy, CANVAS_W - inset * 2, oh);
    ctx.fillStyle = P[3];
    ctx.font = FONT.sm + ' "Press Start 2P", monospace';
    ctx.fillText('Leave this line alone:', inset * 2, oy + Math.floor(TILE * 0.55));
    ctx.fillText(label, inset * 2, oy + Math.floor(TILE * 0.95));
    ctx.fillStyle = P[2];
    ctx.font = FONT.xs + ' "Press Start 2P", monospace';
    ctx.fillText('<- -> then SPACE', inset * 2, oy + oh - Math.floor(TILE * 0.28));
  }

  function drawFinaleOverlay() {
    if (!state.finale || state.dialog.length > 0) return;
    ctx.fillStyle = FINALE_DIM;
    ctx.fillRect(0, 0, CANVAS_W, GH * TILE);
    ctx.fillStyle = P[3];
    ctx.font = FONT.lg + ' "Press Start 2P", monospace';
    ctx.fillText('CI PEACE', Math.floor(CANVAS_W * 0.28), Math.floor(TILE * 2.2));
    ctx.font = FONT.sm + ' "Press Start 2P", monospace';
    ctx.fillText('Tap link below', Math.floor(CANVAS_W * 0.18), Math.floor(TILE * 3.2));
  }

  function loop() {
    ctx.fillStyle = P[0];
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    drawWorld();
    drawHUD();
    drawGemOverlay();
    drawPassOverlay();
    drawYamlOverlay();
    drawDialog();
    drawFinaleOverlay();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);

  document.fonts.ready.then(function () {
    requestAnimationFrame(loop);
  }).catch(function () {
    requestAnimationFrame(loop);
  });
})();
  </script>

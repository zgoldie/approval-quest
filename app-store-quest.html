<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP STORE QUEST</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root {
    --green: #00ff41;
    --green-dim: #00aa2a;
    --green-dark: #003a0e;
    --green-glow: rgba(0, 255, 65, 0.15);
    --amber: #ffb700;
    --red: #ff3131;
    --bg: #020f04;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* CRT scanline effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 99;
  }

  .terminal {
    width: 100%;
    max-width: 720px;
  }

  .title-block {
    text-align: center;
    margin-bottom: 40px;
    font-family: 'VT323', monospace;
  }

  .title-block h1 {
    font-size: clamp(36px, 8vw, 72px);
    color: var(--green);
    text-shadow: 0 0 20px var(--green), 0 0 40px var(--green-dim);
    letter-spacing: 4px;
    animation: flicker 8s infinite;
  }

  .title-block .subtitle {
    font-size: 18px;
    color: var(--green-dim);
    margin-top: 4px;
    letter-spacing: 2px;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.7; }
    97% { opacity: 1; }
    98% { opacity: 0.5; }
    99% { opacity: 1; }
  }

  .output {
    min-height: 300px;
    margin-bottom: 24px;
    line-height: 1.8;
    font-size: 15px;
  }

  .line {
    opacity: 0;
    animation: appear 0.05s forwards;
    padding: 2px 0;
  }

  .line.dim { color: var(--green-dim); }
  .line.bright { color: #fff; text-shadow: 0 0 8px var(--green); }
  .line.amber { color: var(--amber); }
  .line.red { color: var(--red); }
  .line.system { color: var(--green-dim); font-size: 13px; }
  .line.gap { height: 12px; }
  .line.big {
    font-family: 'VT323', monospace;
    font-size: 28px;
    color: var(--green);
    text-shadow: 0 0 10px var(--green);
  }

  @keyframes appear {
    to { opacity: 1; }
  }

  .prompt {
    color: var(--green-dim);
    margin-bottom: 20px;
    font-size: 14px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 16px;
  }

  .choice-btn {
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    padding: 10px 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.1s;
    position: relative;
    overflow: hidden;
  }

  .choice-btn::before {
    content: '> ';
    color: var(--green-dim);
  }

  .choice-btn:hover {
    border-color: var(--green);
    background: var(--green-glow);
    color: #fff;
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 12px var(--green-glow), inset 0 0 12px var(--green-glow);
  }

  .choice-btn:active {
    transform: scale(0.99);
  }

  .status-bar {
    display: flex;
    gap: 24px;
    border-top: 1px solid var(--green-dark);
    border-bottom: 1px solid var(--green-dark);
    padding: 8px 0;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--green-dim);
  }

  .status-bar span b {
    color: var(--green);
  }

  .cursor {
    display: inline-block;
    width: 10px;
    height: 16px;
    background: var(--green);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .ending-box {
    border: 1px solid var(--green);
    padding: 20px;
    margin-top: 16px;
    box-shadow: 0 0 20px var(--green-glow), inset 0 0 20px var(--green-glow);
    text-align: center;
  }

  .ending-box.bad {
    border-color: var(--red);
    box-shadow: 0 0 20px rgba(255,49,49,0.2), inset 0 0 20px rgba(255,49,49,0.1);
  }

  .ending-box .cta {
    margin-top: 16px;
    font-size: 13px;
    color: var(--green-dim);
  }

  .ending-box .cta a {
    color: var(--green);
    text-decoration: none;
  }

  .restart-btn {
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--green-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    padding: 8px 20px;
    cursor: pointer;
    margin-top: 20px;
    transition: all 0.15s;
  }

  .restart-btn:hover {
    color: var(--green);
    border-color: var(--green);
    background: var(--green-glow);
  }

  .progress-track {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
  }

  .progress-pip {
    width: 24px;
    height: 4px;
    background: var(--green-dark);
    border: 1px solid var(--green-dim);
  }

  .progress-pip.done {
    background: var(--green-dim);
  }

  .progress-pip.current {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }
</style>
</head>

function updateStats(nodeId) {
  document.getElementById('stat-day').textContent = state.day;
  document.getElementById('stat-sanity').textContent = Math.max(0, state.sanity) + '%';
  document.getElementById('stat-slack').textContent = state.slack;
}

function updateProgress(step) {
  const track = document.getElementById('progress-track');
  track.innerHTML = '';
  for (let i = 0; i < TOTAL_NODES; i++) {
    const pip = document.createElement('div');
    pip.className = 'progress-pip' + (i < step ? ' done' : i === step ? ' current' : '');
    track.appendChild(pip);
  }
}

function renderNode(nodeId) {
  const node = nodes[nodeId];
  state.node = nodeId;
  updateProgress(node.progress);

  const output = document.getElementById('output');
  const choicesEl = document.getElementById('choices');
  output.innerHTML = '';
  choicesEl.innerHTML = '';

  let maxDelay = 0;

  node.lines.forEach(line => {
    const div = document.createElement('div');
    div.className = 'line' + (line.cls ? ' ' + line.cls : '');
    div.textContent = line.text;
    div.style.animationDelay = line.delay + 'ms';
    output.appendChild(div);
    maxDelay = Math.max(maxDelay, line.delay + 100);
  });

  setTimeout(() => {
    if (node.ending === 'good') {
      showGoodEnding(choicesEl);
    } else if (node.ending === 'bad') {
      showBadEnding(choicesEl);
    } else {
      node.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.text;
        btn.onclick = () => {
          state.day += choice.days || 0;
          state.sanity += choice.sanity || 0;
          state.slack += choice.slack || 0;
          updateStats();
          renderNode(choice.next);
        };
        choicesEl.appendChild(btn);
      });
    }
  }, maxDelay + 400);
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approval Quest</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root {
    --green: #00ff41;
    --green-dim: #00aa2a;
    --green-dark: #003a0e;
    --green-glow: rgba(0, 255, 65, 0.15);
    --amber: #ffb700;
    --red: #ff3131;
    --bg: #020f04;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* CRT scanline effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 99;
  }

  .terminal {
    width: 100%;
    max-width: 720px;
  }

  .title-block {
    text-align: center;
    margin-bottom: 40px;
    font-family: 'VT323', monospace;
  }

  .title-block h1 {
    font-size: clamp(36px, 8vw, 72px);
    color: var(--green);
    text-shadow: 0 0 20px var(--green), 0 0 40px var(--green-dim);
    letter-spacing: 4px;
    animation: flicker 8s infinite;
  }

  .title-block .subtitle {
    font-size: 18px;
    color: var(--green-dim);
    margin-top: 4px;
    letter-spacing: 2px;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.7; }
    97% { opacity: 1; }
    98% { opacity: 0.5; }
    99% { opacity: 1; }
  }

  .output {
    min-height: 300px;
    margin-bottom: 24px;
    line-height: 1.8;
    font-size: 15px;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .line {
    opacity: 0;
    animation: appear 0.05s forwards;
    padding: 3px 0;
  }

  .line.dim { color: var(--green-dim); }
  .line.bright { color: #fff; text-shadow: 0 0 8px var(--green); }
  .line.amber { color: var(--amber); }
  .line.red { color: var(--red); }
  .line.system { color: var(--green-dim); font-size: 13px; }
  .line.gap { height: 12px; }
  .line.big {
    font-family: 'VT323', monospace;
    font-size: 28px;
    color: var(--green);
    text-shadow: 0 0 10px var(--green);
  }

  @keyframes appear {
    to { opacity: 1; }
  }

  .prompt {
    color: var(--green-dim);
    margin-bottom: 20px;
    font-size: 14px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 16px;
  }

  .choice-btn {
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    padding: 10px 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.1s;
    position: relative;
    overflow: hidden;
  }

  .choice-btn::before {
    content: '> ';
    color: var(--green-dim);
  }

  .choice-btn:hover {
    border-color: var(--green);
    background: var(--green-glow);
    color: #fff;
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 12px var(--green-glow), inset 0 0 12px var(--green-glow);
  }

  .choice-btn:active {
    transform: scale(0.99);
  }

  .status-bar {
    display: flex;
    gap: 24px;
    border-top: 1px solid var(--green-dark);
    border-bottom: 1px solid var(--green-dark);
    padding: 8px 0;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--green-dim);
  }

  .status-bar span b {
    color: var(--green);
  }

  .cursor {
    display: inline-block;
    width: 10px;
    height: 16px;
    background: var(--green);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .ending-box {
    border: 1px solid var(--green);
    padding: 20px;
    margin-top: 16px;
    box-shadow: 0 0 20px var(--green-glow), inset 0 0 20px var(--green-glow);
    text-align: center;
  }

  .ending-box.bad {
    border-color: var(--red);
    box-shadow: 0 0 20px rgba(255,49,49,0.2), inset 0 0 20px rgba(255,49,49,0.1);
  }

  .ending-box .cta {
    margin-top: 16px;
    font-size: 13px;
    color: var(--green-dim);
  }

  .ending-box .cta a {
    color: var(--green);
    text-decoration: none;
  }

  .restart-btn {
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--green-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    padding: 8px 20px;
    cursor: pointer;
    margin-top: 20px;
    transition: all 0.15s;
  }

  .restart-btn:hover {
    color: var(--green);
    border-color: var(--green);
    background: var(--green-glow);
  }

  .progress-track {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
  }

  .progress-pip {
    width: 24px;
    height: 4px;
    background: var(--green-dark);
    border: 1px solid var(--green-dim);
  }

  .progress-pip.done {
    background: var(--green-dim);
  }

  .progress-pip.current {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }
</style>
</head>
<body>
<div class="terminal">

  <div class="title-block">
    <h1>APPROVAL QUEST</h1>
    <div class="subtitle">a text adventure in bureaucratic suffering</div>
  </div>

  <div class="status-bar">
    <span>DAY <b id="stat-day">1</b></span>
    <span>SANITY <b id="stat-sanity">100%</b></span>
    <span>SLACK MESSAGES <b id="stat-slack">0</b></span>
    <span>BUG FIX <b id="stat-fix">READY</b></span>
  </div>

  <div class="progress-track" id="progress-track"></div>

  <div class="output" id="output"></div>

  <div id="choices" class="choices"></div>

</div>

<script>
const state = {
  day: 1,
  sanity: 100,
  slack: 0,
  node: 'intro'
};

const TOTAL_NODES = 6;

/** Default ms after each line (content, gap row, IN REVIEW., etc.). */
const LINE_MS = 380;

/** Story line: `hold` adds extra LINE_MS pauses after this line. */
function L(text, cls = '', hold = 0) {
  return { text, cls, hold };
}

function G() {
  return { _g: true };
}

function IR() {
  return { _ir: true };
}

function SR() {
  return { _sr: true };
}

function expandLines(raw) {
  let t = 0;
  const out = [];
  for (const item of raw) {
    if (item && item._g) {
      out.push({ text: '', cls: 'gap', delay: t });
      t += LINE_MS;
      continue;
    }
    if (item && item._ir) {
      out.push({ text: 'IN REVIEW.', cls: '', delay: t });
      t += LINE_MS;
      continue;
    }
    if (item && item._sr) {
      out.push({ text: 'Status: IN REVIEW.', cls: 'dim', delay: t });
      t += LINE_MS;
      continue;
    }
    const hold = item.hold || 0;
    out.push({ text: item.text, cls: item.cls || '', delay: t });
    t += LINE_MS + hold * LINE_MS;
  }
  return out;
}

const nodes = {

  intro: {
    progress: 0,
    lines: [
      L('INITIALISING APPROVAL QUEST v1.0.0...', 'system'),
      G(),
      L('THE YEAR: NOW.', 'dim'),

      SR(),
      G(),

    choices: [
      { text: 'Get a coffee. It\'ll be approved by the time you\'re back.', next: 'day1_wait', sanity: 0, slack: 0, days: 0 },

  },

  day1_wait: {
    progress: 1,
    lines: [

      L('You return. Status: IN REVIEW.'),

      L('You go home. Status: IN REVIEW.'),

      L('DAY 2', 'big'),
      L('[09:14] Sarah (Product): hey is the signup fix live yet?', 'amber'),
      L('[09:31] Sarah (Product): just checking :)', 'amber'),
      L('[09:32] Sarah (Product): customers are noticing', 'amber'),
      SR(),
    ],
    choices: [
      { text: 'Reply to Sarah: "It\'s in review, nothing I can do."', next: 'day2_explain', sanity: 0, slack: 3, days: 1 },
      { text: 'Leave Sarah on read. Preserve your energy.', next: 'day2_ignore', sanity: 5, slack: 3, days: 1 },
    ]
  },

  day1_refresh: {
    progress: 1,
    lines: [
      L('> You refresh the status page.', 'dim'),
      G(),
      IR(), IR(), IR(), IR(), IR(), IR(),
      G(),
      L('Three hours pass. Your wrist hurts.', 'dim'),
      G(),
      L('You open Reddit. The timeline does not care that you are in hell.', 'dim'),
      G(),
      L('r/iOSProgramming: "Vibe coded my entire app in one weekend (AMA)"', 'dim'),
      L('r/webdev: "Shipped production with Cursor, zero docs"', 'dim'),
      L('r/SideProject: "My vibe-coded SaaS hit $4k MRR"', 'dim'),
      L('r/Entrepreneur: "Stop overengineering, just vibe code it"', 'dim'),
      L('...', 'dim'),
      L('You scroll past a hundred posts about vibe coding an app.', 'bright'),
      L('None of them mention App Store review. Of course they do not.', 'dim'),

    ],
    choices: [
      { text: 'Post helpful replies: links, gentle corrections, good faith.', next: 'day1_reddit_helpful', sanity: 0, slack: 0, days: 0 },
      { text: 'Leave snarky comments. The void deserves honesty.', next: 'day1_reddit_snark', sanity: -5, slack: 0, days: 0 },
    ]

  day1_reddit_helpful: {
    progress: 1,
    lines: [
      L('> You write calm, constructive replies. You link MDN anyway.', 'dim'),
      L('One thread OP says "thanks actually". The vibe-code posts do not vanish.'),
      L('You feel briefly like a person.', 'dim'),
      G(),
      L('DAY 2', 'big'),
      L('[09:14] Sarah (Product): hey is the signup fix live yet?', 'amber'),
      L('[09:31] Sarah (Product): just checking :)', 'amber'),
      L('[09:32] Sarah (Product): customers are noticing', 'amber'),
      SR(),
    ],
    choices: [
      { text: 'Reply to Sarah: "It\'s in review, nothing I can do."', next: 'day2_explain', sanity: 0, slack: 3, days: 1 },
      { text: 'Leave Sarah on read. Preserve your energy.', next: 'day2_ignore', sanity: 5, slack: 3, days: 1 },
    ]
  },

  day1_reddit_snark: {
    progress: 1,
    lines: [
      L('> You let rip. Snark. Touch grass. Read the HIG.', 'dim'),
      L('Replies arrive faster than your App Store status ever updates.'),
      L('Someone calls you bitter. They are not entirely wrong.', 'red'),
      G(),
      L('DAY 2', 'big'),
      L('[09:14] Sarah (Product): hey is the signup fix live yet?', 'amber'),
      L('[09:31] Sarah (Product): just checking :)', 'amber'),
      L('[09:32] Sarah (Product): customers are noticing', 'amber'),
      SR(),
    ],
    choices: [
      { text: 'Reply to Sarah: "It\'s in review, nothing I can do."', next: 'day2_explain', sanity: 0, slack: 3, days: 1 },
      { text: 'Leave Sarah on read. Preserve your energy.', next: 'day2_ignore', sanity: 5, slack: 3, days: 1 },
    ]
  },

  day2_explain: {
    progress: 2,
    lines: [
      L('> You explain the review process to Sarah. Again.', 'dim'),
      L('[09:35] You: It\'s with Apple. Review takes 1-3 days. No ETA.'),

      L('You stare at the ceiling for a moment.', 'dim'),
      L('Then: a notification.', 'bright'),
      G(),
      L('APPLE REVIEW TEAM: Your submission has been rejected.', 'red'),
      L('"We were unable to log in using the credentials provided."', 'red'),
      L('You check the logs. The reviewer typed "passw0rd" not "password".', 'bright'),

    ],
    choices: [
      { text: 'Reply politely: "The credentials are correct. Please retry."', next: 'day3_polite', sanity: -10, slack: 0, days: 1 },
      { text: 'Reply less politely. Attach the logs. Express yourself.', next: 'day3_logs', sanity: 5, slack: 1, days: 1 },
    ]
  },

  day2_ignore: {
    progress: 2,
    lines: [
      L('> You leave Sarah on read.', 'dim'),
      L('This lasts 11 minutes.', 'dim'),
      L('[09:43] Marcus (Engineering Manager): Sarah says the signup fix isn\'t live?', 'amber'),
      L('[09:44] Marcus (Engineering Manager): what\'s the hold up', 'amber'),
      L('A notification arrives.', 'bright'),
      G(),
      L('APPLE REVIEW TEAM: Your submission has been rejected.', 'red'),
      L('"We were unable to log in using the credentials provided."', 'red'),
      L('You check the logs. The reviewer typed "passw0rd" not "password".', 'bright'),
      L('A zero. In place of the O. You double-check. Yes.'),
    ],
    choices: [
      { text: 'Reply politely: "The credentials are correct. Please retry."', next: 'day3_polite', sanity: -10, slack: 0, days: 1 },
      { text: 'Reply less politely. Attach the logs. Express yourself.', next: 'day3_logs', sanity: 5, slack: 1, days: 1 },
    ]
  },

  day3_polite: {
    progress: 3,
    lines: [
      L('> You compose a polite reply.', 'dim'),
      L('> You rewrite it twice to remove the sarcasm.', 'dim'),
      L('You resubmit.', 'amber'),
      SR(),
      L('You are back at the end of the queue.'),
      G(),
      L('DAY 3', 'big'),
      L('Tech news: "App Store review times surge 340% as AI app flood continues"', 'dim'),
      L('"Developers report waiting up to 12 days for trivial updates"', 'dim'),
      L('App Store Connect: average rating 4.2 → 3.8 (last 7 days)', 'red'),
      L('New 1-star reviews: "won\'t let me sign up" "stuck on loading forever"', 'dim'),
      L('Support pastes a screenshot thread in Slack. It is not flattering.', 'dim'),
      L('[14:22] Sarah: any update on the update?', 'amber'),
      L('[14:22] Sarah: haha get it. update on the update', 'amber'),
      SR(),
    ],
    choices: [
      { text: 'Keep waiting. This has to end sometime.', next: 'day3b_new_request', sanity: -15, slack: 0, days: 1 },
      { text: 'Mute App Store emails. The problem is still there.', next: 'day3b_new_request', sanity: -5, slack: 0, days: 1 },
    ]
  },

  day3b_new_request: {
    progress: 3,
    lines: [
      L('DAY 4', 'big'),
      SR(),
      L('You allow yourself one cautious breath.', 'dim'),
      G(),
      L('APPLE REVIEW TEAM: Your submission has been rejected.', 'red'),
      L('"Please provide a screen recording of the full signup flow, including OAuth cancel paths."', 'red'),
      L('The login issue was already resolved. This is a new request.', 'bright'),
      L('You record the video. You narrate in a neutral voice. You upload.'),
      L('You resubmit. You are back at the end of the queue.', 'dim'),
      SR(),
    ],
    choices: [
      { text: 'Keep waiting. Surely the video is enough.', next: 'day4_rejection2', sanity: -10, slack: 0, days: 1 },
      { text: 'Reread the rejection until it makes sense. It will not.', next: 'day4_rejection2', sanity: -5, slack: 0, days: 1 },
    ]
  },

  day3_logs: {
    progress: 3,
    lines: [
      L('> You attach the logs. You express yourself.', 'dim'),
      L('> You delete the last sentence. Reattach the logs.', 'dim'),
      L('You resubmit.', 'amber'),
      G(),
      L('DAY 3', 'big'),
      L('Approved! New reviewer. Credentials worked fine.', 'bright'),
      L('Status: PENDING DEVELOPER RELEASE', 'amber'),
      L('You release it. It\'s live. It\'s finally—'),
      L('[16:05] Sarah: this is great! also did you see the profile photo crop bug?', 'amber'),
      L('[16:05] Sarah: avatars are getting cropped weird on iPad', 'amber'),
      L('[16:06] Sarah: can we get that fixed today', 'amber'),
      L('The fix will take 20 minutes.'),
      L('The review will take... you already know.', 'dim'),
    ],
    choices: [
      { text: 'Submit to App Store. You know the drill.', next: 'bad_ending', sanity: -30, slack: 2, days: 1 },
      { text: 'Ship the crop fix through the store too. One ticket, twice the fun.', next: 'bad_ending', sanity: -25, slack: 2, days: 1 },
    ]
  },

  day4_rejection2: {
    progress: 4,
    lines: [
      L('DAY 5', 'big'),
      G(),
      L('APPLE REVIEW TEAM: Your submission has been rejected.', 'red'),
      L('"Screenshots do not accurately reflect the current app UI."', 'red'),
      L('You look at the screenshots.'),
      L('You look at the app.'),
      L('They are identical.', 'bright'),
      L('[11:03] Marcus: CEO is asking about the signup mess', 'amber'),

      L('Your sanity score has reached a new low.', 'red'),
    ],

      { text: 'Retake the screenshots. Resubmit. Reset the clock.', next: 'bad_ending', sanity: -20, slack: 1, days: 1 },
      { text: 'Appeal on principle. Attach a PDF nobody will read.', next: 'bad_ending', sanity: -15, slack: 1, days: 1 },
    ]
  },

  bad_ending: {
    progress: 5,
    lines: [
      L('You resubmit.', 'dim'),
      SR(), SR(), SR(), SR(), SR(), SR(),
      G(),
      L('You are still here.', 'red'),
      L('You will always be here.', 'red'),
      G(),
      L('GAME OVER', 'big'),
    ],
    choices: [],
    ending: 'bad'
  }

};

function updateStats(nodeId) {
  document.getElementById('stat-day').textContent = state.day;
  document.getElementById('stat-sanity').textContent = Math.max(0, state.sanity) + '%';
  document.getElementById('stat-slack').textContent = state.slack;
}

function updateProgress(step) {
  const track = document.getElementById('progress-track');
  track.innerHTML = '';
  for (let i = 0; i < TOTAL_NODES; i++) {
    const pip = document.createElement('div');
    pip.className = 'progress-pip' + (i < step ? ' done' : i === step ? ' current' : '');
    track.appendChild(pip);
  }
}

function renderNode(nodeId) {
  const node = nodes[nodeId];
  state.node = nodeId;
  updateProgress(node.progress);

  const output = document.getElementById('output');
  const choicesEl = document.getElementById('choices');
  output.innerHTML = '';
  choicesEl.innerHTML = '';

  let maxDelay = 0;

  expandLines(node.lines).forEach(line => {
    const div = document.createElement('div');
    div.className = 'line' + (line.cls ? ' ' + line.cls : '');
    div.textContent = line.text;
    div.style.animationDelay = line.delay + 'ms';
    output.appendChild(div);
    maxDelay = Math.max(maxDelay, line.delay + 100);
  });

  setTimeout(() => {
    if (node.ending === 'bad') {
      showBadEnding(choicesEl);
    } else {
      node.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.text;
        btn.onclick = () => {
          state.day += choice.days || 0;
          state.sanity += choice.sanity || 0;
          state.slack += choice.slack || 0;
          updateStats();
          renderNode(choice.next);
        };
        choicesEl.appendChild(btn);
      });
    }
  }, maxDelay + 400);
}

function showBadEnding(container) {
  const box = document.createElement('div');
  box.className = 'ending-box bad';
  box.innerHTML = `
    <div class="line big" style="opacity:1; color: var(--red);">STILL IN REVIEW</div>
    <br>
    <div style="color: var(--green-dim); line-height: 1.8; font-size: 14px;">
      This didn't have to happen.<br>
      For JS bundle changes, CodePush bypasses the store entirely.<br>
      <br>
      Your fix could have shipped in seconds.
    </div>
    <div class="cta">
      There is a better way →&nbsp;<a href="https://codemagic.io/codepush" target="_blank">codemagic.io/codepush</a>
    </div>
    <br>
    <button class="restart-btn" onclick="restartGame()">[ TRY AGAIN ]</button>
  `;
  container.appendChild(box);
}

function restartGame() {
  state.day = 1;
  state.sanity = 100;
  state.slack = 0;
  renderNode('intro');
  updateStats();
}

restartGame();
</script>
</body>
</html>

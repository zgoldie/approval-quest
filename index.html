<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approval Quest</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root {
    --green: #00ff41;
    --green-dim: #00aa2a;
    --green-dark: #003a0e;
    --green-glow: rgba(0, 255, 65, 0.15);
    --amber: #ffb700;
    --red: #ff3131;
    --bg: #020f04;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    text-shadow: 0 0 6px rgba(0, 255, 65, 0.35);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* CRT scanline effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 99;
  }

  .terminal {
    width: 100%;
    max-width: 720px;
    position: relative;
    z-index: 1;
    padding: 34px 28px 26px;
  }

  .title-block {
    text-align: center;
    margin-bottom: 40px;
    font-family: 'VT323', monospace;
  }

  .title-block h1 {
    font-size: clamp(36px, 8vw, 72px);
    color: var(--green);
    text-shadow: 0 0 20px var(--green), 0 0 40px var(--green-dim);
    letter-spacing: 4px;
    animation: flicker 8s infinite;
  }

  .title-block .subtitle {
    font-size: 18px;
    color: var(--green-dim);
    margin-top: 4px;
    letter-spacing: 2px;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.7; }
    97% { opacity: 1; }
    98% { opacity: 0.5; }
    99% { opacity: 1; }
  }

  .output {
    min-height: 300px;
    margin-bottom: 24px;
    line-height: 1.8;
    font-size: 15px;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .output.ending-state {
    min-height: 0;
    margin-bottom: 8px;
  }

  .line {
    opacity: 0;
    animation: appear 0.05s forwards;
    padding: 3px 0;
  }

  .line.dim { color: var(--green-dim); }
  .line.bright { color: #fff; text-shadow: 0 0 8px var(--green); }
  .line.amber { color: var(--amber); }
  .line.red { color: var(--red); }
  .line.system { color: var(--green-dim); font-size: 13px; }
  .line.init-boot {
    animation: bootline 1.6s forwards;
    overflow: hidden;
  }
  .line.gap { height: 12px; }
  .line.big {
    font-family: 'VT323', monospace;
    font-size: 28px;
    color: var(--green);
    text-shadow: 0 0 10px var(--green);
  }

  @keyframes appear {
    to { opacity: 1; }
  }

  @keyframes bootline {
    0% {
      opacity: 0;
      max-height: 28px;
      padding-top: 3px;
      padding-bottom: 3px;
      margin: 0;
    }
    10%, 70% {
      opacity: 1;
      max-height: 28px;
      padding-top: 3px;
      padding-bottom: 3px;
      margin: 0;
    }
    100% {
      opacity: 0;
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin: 0;
    }
  }

  .prompt {
    color: var(--green-dim);
    margin-bottom: 20px;
    font-size: 14px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 20px;
    padding-top: 6px;
  }

  .choice-btn {
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    padding: 12px 18px;
    text-align: left;
    cursor: pointer;
    transition: all 0.1s;
    position: relative;
    overflow: hidden;
  }

  .choice-btn::before {
    content: '> ';
    color: var(--green-dim);
  }

  .choice-btn:hover {
    border-color: var(--green);
    background: var(--green-glow);
    color: #fff;
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 12px var(--green-glow), inset 0 0 12px var(--green-glow);
  }

  .choice-btn.selected {
    border-color: var(--green);
    background: var(--green-glow);
    color: #fff;
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 12px var(--green-glow), inset 0 0 12px var(--green-glow);
    cursor: default;
  }

  .choice-btn:disabled {
    opacity: 0.85;
  }

  .choice-btn:active {
    transform: scale(0.99);
  }

  .cursor {
    display: inline-block;
    width: 10px;
    height: 16px;
    background: var(--green);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .restart-btn {
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--green-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    padding: 8px 20px;
    cursor: pointer;
    margin-top: 20px;
    transition: all 0.15s;
  }

  .restart-btn:hover {
    color: var(--green);
    border-color: var(--green);
    background: var(--green-glow);
  }

  .progress-track {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
  }

  .progress-pip {
    width: 24px;
    height: 4px;
    background: var(--green-dark);
    border: 1px solid var(--green-dim);
  }

  .progress-pip.done {
    background: var(--green-dim);
  }

  .progress-pip.current {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }
</style>
</head>
<body>
<div class="terminal">

  <div class="title-block">
    <h1>APPROVAL QUEST</h1>
    <div class="subtitle">a dungeon crawl through the Store of Applications</div>
  </div>

  <div class="progress-track" id="progress-track"></div>

  <div class="output" id="output"></div>

  <div id="choices" class="choices"></div>

</div>

<script>
const state = {
  day: 1,
  sanity: 100,
  slack: 0,
  node: 'intro'
};

const TOTAL_NODES = 6;
const CHOICE_PAUSE_MS = 420;

/** Default ms after each line (content, gap row, IN REVIEW., etc.). */
const LINE_MS = 380;

/** Story line: `hold` adds extra LINE_MS pauses after this line. */
function L(text, cls = '', hold = 0) {
  return { text, cls, hold };
}

function G() {
  return { _g: true };
}

function IR() {
  return { _ir: true };
}

function expandLines(raw) {
  let t = 0;
  const out = [];
  for (const item of raw) {
    if (item && item._g) {
      out.push({ text: '', cls: 'gap', delay: t });
      t += LINE_MS;
      continue;
    }
    if (item && item._ir) {
      out.push({ text: 'IN REVIEW.', cls: '', delay: t });
      t += LINE_MS;
      continue;
    }
    const hold = item.hold || 0;
    out.push({ text: item.text, cls: item.cls || '', delay: t });
    t += LINE_MS + hold * LINE_MS;
  }
  return out;
}

const nodes = {

  intro: {
    progress: 0,
    lines: [
      L('INITIALISING APPROVAL QUEST v1.0.0...', 'system init-boot', 2),
      G(),
      L('CHAMBER I — THE GATEKEEPERS', 'big'),
      L('You arrive at the gates of the Store of Applications.', 'dim'),
      L('You announce yourself to the review goblin.', 'bright'),
      L('It holds perfectly still, only its eyes swivel towards you.', 'bright'),
      G(),
      L('You announce "the password is Test Phrase"', 'dim'),
      G(),
      L('A day and a night pass.', 'amber', 1),
      L('No word is spoken. No signal is given.', 'dim'),
      G(),
      L("The goblin's vacant eyes stare through you.", 'dim'),
 
      L('What do you do?', 'dim'),
    ],
    choices: [
      { text: 'Pull out a book, keep waiting', next: 'chamber1', sanity: 1, slack: 0, days: 0 },
      { text: 'Clear your throat and talk to the goblin', next: 'chamber1', sanity: -1, slack: 0, days: 0 },
    ]
  },

  chamber1: {
    progress: 1,
    lines: [
      L('CHAMBER I — THE GATEKEEPERS', 'big'),
      L('At last, the goblin speaks.', 'bright'),
      G(),
      L('THE GOBLIN: "Best Phrase" is invalid. Review denied.', 'red'),
      L('You close your eyes for a brief and private moment.', 'dim'),
      G(),
    ],
    choices: [
      { text: 'After a calming breath, repeat: "The password is Test Phrase."', next: 'gate_passed', sanity: -2, slack: 0, days: 1 },
      { text: 'Repeat, slower and louder: "The password. Is. TEST. PHRASE."', next: 'gate_passed', sanity: -1, slack: 0, days: 1 },
    ]
  },

  gate_passed: {
    progress: 1,
    lines: [
      L('CHAMBER I — THE GATEKEEPERS', 'big'),
      L('The goblin is silent for so long you suspect another full day has gone by.', 'dim'),
      L('While you wait, a message scroll appears before you.', 'bright'),
      L('SCROLL: The Chief saw a sign outside The Store, saying reviews usually take 24 hours.', 'amber'),
      L('SCROLL: He asks if you are still alive and if so, what is taking so long?', 'amber'),
      G(),
      L('The goblin gives a slow nod, with a content smile', 'dim'),
      L('It steps aside and ushers you onward.', 'bright'),
    ],
    choices: [
      { text: 'Enter the next chamber.', next: 'chamber2', sanity: 1, slack: 0, days: 0 },
    ]
  },

  chamber2: {
    progress: 2,
    lines: [
      L('CHAMBER II — THE HALL OF METADATA', 'big'),
      L('You enter a new chamber, the walls are covered in colorful scrolls.', 'dim'),
      L('A new goblin bars the way. A familiar vacant gaze turns to you.', 'dim'),
      G(),
      L('GOBLIN: Please present your iconography.', 'amber'),
 
      L('You give it your carefully prepared scroll.', 'bright'),
      G(),
      L('After gazing at the scroll for hours, it drops it on the floor.', 'dim'),
      L('GOBLIN: Denied. Does not meet requirements.', 'red'),
      L('You wait for details. None are given.', 'dim'),
    ],
    choices: [
      { text: 'Check the thick tome beside the goblin.', next: 'chamber2_tome', sanity: -1, slack: 0, days: 0 },
      { text: 'Send a message scroll to a fellow mage asking about rule changes.', next: 'chamber2_mage', sanity: -1, slack: 1, days: 0 },
    ]
  },

  chamber2_mage: {
    progress: 2,
    lines: [
      L('Your scroll flies out to a fellow mage.', 'dim'),
      L('A reply returns quickly: "Haven\'t heard anything. Sorry."', 'amber'),
      L('No one knows. The goblin does not elaborate.', 'dim'),
    ],
    choices: [
      { text: 'Check the thick tome anyway.', next: 'chamber2_tome', sanity: -1, slack: 0, days: 0 },
    ]
  },

  chamber2_tome: {
    progress: 2,
    lines: [
      L('You open the thick tome beside the goblin.', 'dim'),
      L('The pages are dense, dry, and endless.', 'dim'),
      L('You eventually find a small note near the very back:', 'bright'),
      L('TOME: Required scroll dimensions changed from 8 x 14" to 8 x 13.9".', 'amber'),
      L('This contradicts earlier instructions, but you try it anyway.', 'dim'),
      L('You take your knife, slice off a sliver of scroll, and resubmit.', 'dim'),
      L('A day later, it is accepted.', 'bright'),
      G(),
      L('A new message scroll arrives.', 'dim'),
      L('SCROLL: The Chief has hired a Fang Wizard and is very excited.', 'amber'),
      L('SCROLL: The Chief is sure that this will speed things up.', 'amber'),
    ],
    choices: [
      { text: 'Move to the next chamber.', next: 'chamber3', sanity: -4, slack: 0, days: 1 },
    ]
  },

  chamber3: {
    progress: 3,
    lines: [
      L('CHAMBER III — THE WAITING CORRIDOR', 'big'),
      L('No goblins here. Only lamps on the wall.', 'dim'),
      IR(), IR(), IR(),
      G(),
      L('Each lamp bears the same inscription.', 'dim'),
      IR(), IR(),
      G(),
      L('The corridor does not end. Your footsteps echo.', 'dim'),
      G(),
      L('SCROLL: The Fang Wizard has a question about store keys.', 'amber'),
      L('SCROLL: The Fang Wizard is stating this was someone else\'s responsibility at their last role.', 'amber'),
      L('SCROLL: The Chief is still delighted that we\'ve hired a Fang Wizard.', 'amber'),
    ],
    choices: [
      { text: 'Relay with guidance for the wizard. Perhaps it will help.', next: 'chamber4', sanity: -10, slack: 2, days: 5 },
      { text: 'Ignore the request. Keep walking.', next: 'chamber4', sanity: 0, slack: 1, days: 2 },
    ]
  },

  chamber4: {
    progress: 4,
    lines: [
      L('CHAMBER IV — THE INNER SANCTUM', 'big'),
      L('A young goblin lounges behind the desk, gently humming to itself.', 'dim'),
      G(),
      L('It glances at your scroll for a heartbeat and stamps it.', 'bright'),
      L('The seal reads: APPROVED.', 'bright'),
      L('No reason is given. It is looking away, back to its humming.', 'dim'),
      L('The gates of the store grind open.', 'dim'),
      G(),
      L('SCROLL: The Fang Wizard seems unfamiliar with the Store of Applications process.', 'amber'),
      L('SCROLL: Can you train them?', 'amber'),
      G(),
      L('You permit yourself half a breath.', 'dim'),
    ],
    choices: [
      { text: 'Thank the small goblin. It does not look up.', next: 'ending', sanity: 0, slack: 0, days: 0 },
      { text: 'Leave in silence. The lamps flicker as you go.', next: 'ending', sanity: 0, slack: 0, days: 0 },
    ]
  },

  ending: {
    progress: 5,
    lines: [
      L('APPROVED', 'big'),
      G(),
      L('You re-emerge into daylight. You touch some grass.', 'dim'),
      L('A scroll arrives.', 'bright'),
      L('SCROLL:Good news. We worked on more changes while you were gone.', 'amber'),
      L('SCROLL: Could you submit them to the Store of Applications tomorrow?', 'amber'),
      L('SCROLL: The Fang Wizard thinks that you are best suited to the task.', 'amber'),
    ],
    choices: [
      { text: '[ SKIP THE STORE. USE CODEPUSH ]', next: 'intro', sanity: 0, slack: 0, days: 0, href: 'https://codemagic.io/codepush' },
      { text: '[ START AGAIN ]', next: 'intro', sanity: 0, slack: 0, days: 0 },
    ]
  }

};

function updateStats() {
  // HUD intentionally removed.
}

function updateProgress(step) {
  const track = document.getElementById('progress-track');
  track.innerHTML = '';
  for (let i = 0; i < TOTAL_NODES; i++) {
    const pip = document.createElement('div');
    pip.className = 'progress-pip' + (i < step ? ' done' : i === step ? ' current' : '');
    track.appendChild(pip);
  }
}

function renderNode(nodeId) {
  const node = nodes[nodeId];
  state.node = nodeId;
  updateProgress(node.progress);

  const output = document.getElementById('output');
  const choicesEl = document.getElementById('choices');
  output.classList.toggle('ending-state', Boolean(node.ending));
  output.innerHTML = '';
  choicesEl.innerHTML = '';

  let maxDelay = 0;

  expandLines(node.lines).forEach(line => {
    const div = document.createElement('div');
    div.className = 'line' + (line.cls ? ' ' + line.cls : '');
    div.textContent = line.text;
    div.style.animationDelay = line.delay + 'ms';
    output.appendChild(div);
    maxDelay = Math.max(maxDelay, line.delay + 100);
  });

  setTimeout(() => {
    node.choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice.text;
      btn.onclick = () => {
        const allButtons = Array.from(choicesEl.querySelectorAll('.choice-btn'));
        allButtons.forEach(b => {
          b.disabled = true;
          b.classList.remove('selected');
        });
        btn.classList.add('selected');
          if (choice.href) {
            window.open(choice.href, '_blank');
          }
        state.day += choice.days || 0;
        state.sanity += choice.sanity || 0;
        state.slack += choice.slack || 0;
        updateStats();
        setTimeout(() => renderNode(choice.next), CHOICE_PAUSE_MS);
      };
      choicesEl.appendChild(btn);
    });
  }, maxDelay + 400);
}

function restartGame() {
  state.day = 1;
  state.sanity = 100;
  state.slack = 0;
  renderNode('intro');
  updateStats();
}

restartGame();
</script>
</body>
</html>

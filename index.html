  :root {

    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* CRT scanline effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 99;
  }

/** Default ms after each line (content, gap row, IN REVIEW., etc.). */
const LINE_MS = 650;

/** Story line: `hold` adds extra LINE_MS pauses after this line. */
function L(text, cls = '', hold = 0) {
  return { text, cls, hold };
}

function G() {
  return { _g: true };
}

function IR() {
  return { _ir: true };
}

function expandLines(raw) {
  let t = 0;
  const out = [];
  for (const item of raw) {
    if (item && item._g) {
      out.push({ text: '', cls: 'gap', delay: t });
      t += LINE_MS;
      continue;
    }
    if (item && item._ir) {
      out.push({ text: 'IN REVIEW.', cls: '', delay: t });
      t += LINE_MS;
      continue;
    }
    const hold = item.hold || 0;
    out.push({ text: item.text, cls: item.cls || '', delay: t });
    t += LINE_MS + hold * LINE_MS;
  }
  return out;
}

function updateProgress(step) {
  const track = document.getElementById('progress-track');
  track.innerHTML = '';
  const complete = step >= TOTAL_NODES;
  for (let i = 0; i < TOTAL_NODES; i++) {
    const pip = document.createElement('div');
    if (complete || i < step) pip.className = 'progress-pip done';
    else if (i === step) pip.className = 'progress-pip current';
    else pip.className = 'progress-pip';
    track.appendChild(pip);
  }
}

function renderNode(nodeId) {
  const node = nodes[nodeId];
  state.node = nodeId;
  updateProgress(node.progress);

  const output = document.getElementById('output');
  const choicesEl = document.getElementById('choices');
  output.classList.toggle('ending-state', Boolean(node.ending));
  output.innerHTML = '';
  choicesEl.innerHTML = '';

  let maxDelay = 0;

  expandLines(node.lines).forEach(line => {
    const div = document.createElement('div');
    div.className = 'line' + (line.cls ? ' ' + line.cls : '');
    div.textContent = line.text;
    div.style.animationDelay = line.delay + 'ms';
    output.appendChild(div);
    maxDelay = Math.max(maxDelay, line.delay + 100);
  });

  setTimeout(() => {
    node.choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice.text;
      btn.onclick = () => {
        const allButtons = Array.from(choicesEl.querySelectorAll('.choice-btn'));
        allButtons.forEach(b => {
          b.disabled = true;
          b.classList.remove('selected');
        });
        btn.classList.add('selected');
          if (choice.href) {
            window.open(choice.href, '_blank');
          }
        state.day += choice.days || 0;
        state.sanity += choice.sanity || 0;
        state.slack += choice.slack || 0;
        updateStats();
        setTimeout(() => {
          if (choice.next === 'welcome') {
            showWelcome();
          } else {
            renderNode(choice.next);
          }
        }, CHOICE_PAUSE_MS);
      };
      choicesEl.appendChild(btn);
    });
    if (node.share) {
      showShareBlock(choicesEl);
    }
  }, maxDelay + 400);
}

function getShareUrl() {
  return 'https://approval.quest';
}

function showShareBlock(container) {
  const url = getShareUrl();
  const block = document.createElement('div');
  block.className = 'share-block';

  const inner = document.createElement('div');
  inner.className = 'share-block-inner';

  const copy = document.createElement('div');
  copy.className = 'share-block-copy';

  const title = document.createElement('div');
  title.className = 'share-block-title';
  title.textContent = 'Distract A Colleague';
  copy.appendChild(title);

  const hint = document.createElement('div');
  hint.className = 'share-block-hint';
  hint.textContent = 'Share the link to send them into the dungeon';
  copy.appendChild(hint);

  const urlEl = document.createElement('div');
  urlEl.className = 'share-url';
  urlEl.textContent = url;
  copy.appendChild(urlEl);

  const qrHost = document.createElement('div');
  qrHost.className = 'share-qr';

  inner.appendChild(copy);
  inner.appendChild(qrHost);
  block.appendChild(inner);
  container.appendChild(block);

  if (typeof QRCode !== 'undefined') {
    new QRCode(qrHost, {
      text: url,
      width: 128,
      height: 128,
      colorDark: '#00ff41',
      colorLight: '#020f04',
      correctLevel: QRCode.CorrectLevel.M
    });
  }
}

function restartGame() {
  state.day = 1;
  state.sanity = 100;
  state.slack = 0;
  renderNode('intro');
  updateStats();
}

function showWelcome() {
  state.day = 1;
  state.sanity = 100;
  state.slack = 0;
  document.getElementById('welcome').hidden = false;
  document.getElementById('game').hidden = true;
  document.getElementById('output').innerHTML = '';
  document.getElementById('choices').innerHTML = '';
  document.getElementById('progress-track').innerHTML = '';
  updateStats();
}

function startGame() {
  document.getElementById('welcome').hidden = true;
  document.getElementById('game').hidden = false;
  restartGame();
}

document.getElementById('start-btn').onclick = startGame;
showWelcome();
</script>
